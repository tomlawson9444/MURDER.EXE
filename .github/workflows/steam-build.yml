# Builds the Steam desktop app (Steam Build/) on Windows and Linux and attaches the folders to the run,
# ready to upload through SteamPipe. Runs when the game or the build changes on main, or by hand from the Actions tab.
name: Steam Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["prototype/**", "Steam Build/**", ".github/workflows/steam-build.yml"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win dir
            out: win-unpacked
          - os: ubuntu-latest
            target: --linux dir
            out: linux-unpacked
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Steam Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Valve's Steam API libraries can't live in this public repo. Store a zip of the SDK's redistributable_bin folder,
      # base64-encoded, as the STEAMWORKS_REDIST secret (see Steam Build/README.md). Without it the build still works,
      # but Steam features (achievements, leaderboards, co-op) stay off in that build.
      - name: Steamworks SDK redistributables
        shell: bash
        env:
          STEAMWORKS_REDIST: ${{ secrets.STEAMWORKS_REDIST }}
        run: |
          if [ -z "$STEAMWORKS_REDIST" ]; then echo "::warning::STEAMWORKS_REDIST secret not set; this build has no Steam features"; exit 0; fi
          echo "$STEAMWORKS_REDIST" | base64 -d > redist.zip && unzip -q -o redist.zip -d steamworks_sdk && rm redist.zip
          ls steamworks_sdk/redistributable_bin
      - run: npm run game
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: Steam Build/dist/linux-unpacked
        run: MURDER_SMOKE=1 xvfb-run -a ./murder-exe --no-sandbox --disable-gpu
      - uses: actions/upload-artifact@v4
        with:
          name: MURDER.EXE-${{ matrix.out }}
          path: Steam Build/dist/${{ matrix.out }}
